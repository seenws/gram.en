<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="screen">
        <div class="container">
            <div class="textarea-wrapper">
                <textarea class="textfield" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
                <div class="fake-placeholder"></div>
            </div>

            <div class="content">
                <div class="switches">
                    <input type="radio" id="switch1" name="switch-group" class="switch-input" checked>
                    <label for="switch1" class="switch-label">Japanese</label>
                    <input type="radio" id="switch2" name="switch-group" class="switch-input">
                    <label for="switch2" class="switch-label">Swedish</label>
                    <input type="radio" id="switch3" name="switch-group" class="switch-input">
                    <label for="switch3" class="switch-label">English</label>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

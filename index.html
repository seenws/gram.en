<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>grammar</title>
</head>
<body>
    <main class="screen">
        <div class="container">
            <header class="masthead">
                <h1 class="title">gram.en</h1>
                <p class="subtitle">type a sentence &mdash; grammatical issues get underlined</p>
            </header>

            <div class="textarea-wrapper">
                <textarea class="textfield" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="50"></textarea>
                <div class="highlights" aria-hidden="true"></div>
                <div class="fake-placeholder"></div>
                <div class="char-counter" aria-hidden="true"></div>
                <div class="popover" hidden></div>
            </div>

            <div class="status" role="status" aria-live="polite"></div>

            <div class="lang">
                <span class="lang-badge">English</span>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <!-- engine bundle (global GrammarEngine), then the page logic -->
    <script src="dist/engine.js"></script>
    <script src="index.js"></script>
</body>
</html>
